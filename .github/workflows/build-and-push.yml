name: Build and push image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Sentinel version and image tag (for example, 1.8.10)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update Sentinel version
        env:
          SENTINEL_VERSION: ${{ inputs.tag }}
        run: |
          if [[ ! "${SENTINEL_VERSION}" =~ ^[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Sentinel version: ${SENTINEL_VERSION}" >&2
            exit 1
          fi
          sed -i "s/^ARG SENTINEL_VERSION=.*/ARG SENTINEL_VERSION=${SENTINEL_VERSION}/" Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SENTINEL_VERSION=${{ inputs.tag }}
          tags: ghcr.io/${{ github.repository_owner }}/alibaba-sentinel:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit Dockerfile version
        env:
          SENTINEL_VERSION: ${{ inputs.tag }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- Dockerfile; then
            echo "Dockerfile already uses Sentinel ${SENTINEL_VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "Update Sentinel to ${SENTINEL_VERSION}"
          git push origin "HEAD:${TARGET_BRANCH}"
